# Render blueprint for the Python backend (free plan).
# Render dashboard > New > Blueprint > pick this repo. It will ask for LLM_API_KEY.
services:
  - type: web
    name: courtroom-rag
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_API_KEY
        sync: false        # secret, you type it in the dashboard
      - key: ALLOWED_ORIGINS
        value: "*"         # change to your netlify url once you have it
      - key: TRIALS_PER_HOUR
        value: "30"
      - key: ALLOW_UPLOADS
        value: "true"
